[supervisord]
nodaemon=true
logfile=/data/supervisord.log
pidfile=/run/ontology/supervisord.pid

[program:memgraph]
command=/usr/lib/memgraph/memgraph --data-directory=/data/memgraph/lib --log-file=/data/memgraph/log/memgraph.log --bolt-port=7687 --also-log-to-stderr=true
priority=10
autostart=true
autorestart=true
startsecs=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:graphql]
command=/usr/local/bin/node /opt/ontology-graphql/server.js
priority=20
autostart=true
autorestart=true
startretries=10
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:lab]
command=/bin/sh -c 'if [ -x /opt/memgraph-lab/start.sh ]; then exec /opt/memgraph-lab/start.sh; elif [ -f /opt/memgraph-lab/dist-backend/index.js ]; then cd /opt/memgraph-lab && exec /usr/local/bin/node dist-backend/index.js; elif [ -f /opt/memgraph-lab/package.json ]; then cd /opt/memgraph-lab && exec npm start -- --host 0.0.0.0 --port 3000; else exit 0; fi'
priority=30
autostart=false
autorestart=false
stopsignal=TERM
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
