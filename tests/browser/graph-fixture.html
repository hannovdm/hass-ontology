<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ontology graph fixture</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #f4f7f8; color: #172126; }
      body { min-height: 100vh; }
    </style>
  </head>
  <body>
    <script type="module">
      import "/custom_components/ontology/panel/ontology-panel.js";

      const state = new URLSearchParams(location.search).get("state") || "populated";
      const populated = {
        nodes: [
          { id: "Area:kitchen", haId: "kitchen", type: "AREA", label: "Kitchen", icon: "mdi:countertop-outline", unavailable: false, properties: [] },
          { id: "Device:lamp", haId: "lamp", type: "DEVICE", label: "Kitchen lamp", icon: "mdi:lightbulb", unavailable: false, properties: [] },
          { id: "Device:portable", haId: "portable", type: "DEVICE", label: "Portable sensor", icon: "invalid icon", unavailable: true, properties: [] },
          { id: "ValidationFinding:missing-area", haId: "missing-area", type: "VALIDATION_FINDING", label: "Missing area assignment", unavailable: false, findingSeverity: "WARNING", properties: [] },
        ],
        relationships: [
          { id: "HAS_DEVICE:1", type: "HAS_DEVICE", source: "Area:kitchen", target: "Device:lamp", directed: true, properties: [] },
          { id: "AFFECTS:1", type: "AFFECTS", source: "ValidationFinding:missing-area", target: "Device:portable", directed: true, properties: [] },
        ],
        truncated: false,
        next_cursor: null,
        revision: 7,
      };
      const exploration = {
        nodes: [
          { id: "Device:lamp", haId: "lamp", type: "DEVICE", label: "Kitchen lamp", icon: "mdi:lightbulb", unavailable: false, properties: [{ name: "manufacturer", value: "Local", displayValue: "Local" }] },
          { id: "Entity:sensor.kitchen_temperature", haId: "sensor.kitchen_temperature", type: "ENTITY", label: "Kitchen temperature", icon: "mdi:thermometer", state: "21.4", unavailable: false, properties: [{ name: "state", value: "21.4", displayValue: "21.4" }] },
          { id: "Entity:sensor.shared_a", haId: "sensor.shared_a", type: "ENTITY", label: "Shared sensor", icon: "mdi:thermometer", unavailable: false, properties: [] },
        ],
        relationships: [
          { id: "HAS_ENTITY:primary", type: "HAS_ENTITY", source: "Device:lamp", target: "Entity:sensor.kitchen_temperature", directed: true, properties: [] },
          { id: "HAS_ENTITY:secondary", type: "HAS_ENTITY", source: "Device:lamp", target: "Entity:sensor.kitchen_temperature", directed: true, properties: [{ name: "channel", value: 2, displayValue: "2" }] },
          { id: "REFERENCES:self", type: "REFERENCES", source: "Entity:sensor.kitchen_temperature", target: "Entity:sensor.kitchen_temperature", directed: true, properties: [] },
        ],
        truncated: false,
        next_cursor: null,
        revision: 8,
      };
      const areaOverview = {
        nodes: [
          populated.nodes[0],
          { id: "Area:garage", haId: "garage", type: "AREA", label: "Garage", icon: "mdi:garage", unavailable: false, properties: [] },
        ],
        relationships: [],
        truncated: false,
        next_cursor: null,
        revision: 7,
      };
      const areaExploration = {
        nodes: populated.nodes.slice(0, 3),
        relationships: populated.relationships.slice(0, 1),
        truncated: false,
        next_cursor: null,
        revision: 8,
      };
      const areaNeighborhood = {
        nodes: [
          populated.nodes[0],
          populated.nodes[1],
        ],
        relationships: [
          populated.relationships[0],
        ],
        truncated: false,
        next_cursor: null,
        revision: 8,
      };
      const entityNeighborhood = {
        nodes: [
          exploration.nodes[1],
          { id: "Device:hall-display", haId: "hall-display", type: "DEVICE", label: "Hall display", icon: "mdi:tablet-dashboard", unavailable: false, properties: [] },
          { id: "Automation:morning", haId: "morning", type: "AUTOMATION", label: "Morning routine", icon: "mdi:robot", unavailable: false, properties: [] },
          { id: "DashboardCard:lovelace::0::0", haId: "lovelace::0::0", type: "DASHBOARD_CARD", label: "Kitchen card", icon: "mdi:card-outline", unavailable: false, properties: [] },
          exploration.nodes[0],
        ],
        relationships: [
          { id: "HAS_ENTITY:external", type: "HAS_ENTITY", source: "Device:hall-display", target: "Entity:sensor.kitchen_temperature", directed: true, properties: [] },
          { id: "REFERENCES:1", type: "REFERENCES", source: "Automation:morning", target: "Entity:sensor.kitchen_temperature", directed: true, properties: [] },
          { id: "DISPLAYS_ENTITY:1", type: "DISPLAYS_ENTITY", source: "DashboardCard:lovelace::0::0", target: "Entity:sensor.kitchen_temperature", directed: true, properties: [] },
          exploration.relationships[0],
        ],
        truncated: false,
        next_cursor: null,
        revision: 8,
      };
      const cardNeighborhood = {
        nodes: [
          entityNeighborhood.nodes[3],
          exploration.nodes[1],
          { id: "Dashboard:lovelace", haId: "lovelace", type: "DASHBOARD", label: "Home dashboard", icon: "mdi:view-dashboard-outline", unavailable: false, properties: [] },
        ],
        relationships: [
          entityNeighborhood.relationships[2],
          { id: "CONTAINS_CARD:1", type: "CONTAINS_CARD", source: "Dashboard:lovelace", target: "DashboardCard:lovelace::0::0", directed: true, properties: [] },
        ],
        truncated: false,
        next_cursor: null,
        revision: 8,
      };
      const dashboardNeighborhood = {
        nodes: [cardNeighborhood.nodes[2], entityNeighborhood.nodes[3]],
        relationships: [cardNeighborhood.relationships[1]],
        truncated: false,
        next_cursor: null,
        revision: 8,
      };

      const searchMatches = {
        "Entity:sensor.kitchen_temperature": [exploration.nodes[1]],
        "Kitchen temperature": [exploration.nodes[1]],
        "Shared sensor": [
          exploration.nodes[2],
          { id: "Entity:sensor.shared_b", haId: "sensor.shared_b", type: "ENTITY", label: "Shared sensor", icon: "mdi:thermometer", unavailable: false, properties: [] },
        ],
      };

      const panel = document.createElement("ontology-panel");
      document.body.append(panel);

      const isAdmin = state === "admin" || state === "admin-lab-available";
      const labAvailable = state === "admin-lab-available";

      panel.hass = {
        user: { id: "fixture-user", is_admin: isAdmin },
        states: {},
        callWS: async (message) => {
          (panel._wsCalls ||= []).push(message);
          const { type } = message;
          if (type === "ontology/lab_status") {
            if (!isAdmin) throw { code: "unauthorized", message: "Administrator access required" };
            if (labAvailable) {
              return { available: true, reason: "READY", ingress_path: "/api/hassio_ingress/abc123test", checked_at: new Date().toISOString() };
            }
            return { available: false, reason: "not_addon_backend", ingress_path: null, checked_at: null };
          }
          if (type === "ontology/graph_search" && state === "interactive") {
            return {
              matches: (searchMatches[message.term] || []).map(({ id, haId, type: nodeType, label, icon }) => ({ id, haId, type: nodeType, label, icon })),
              truncated: false,
              revision: 8,
            };
          }
          if (type === "ontology/graph_detail" && (state === "interactive" || state === "live-updates" || state === "area-overview" || state === "double-click-expansion" || state === "dashboard-focus")) {
            const nodes = [...populated.nodes, ...exploration.nodes, ...entityNeighborhood.nodes, ...cardNeighborhood.nodes, ...(searchMatches["Shared sensor"] || [])];
            const node = nodes.find(({ id }) => id === message.element_id);
            const relationship = [...exploration.relationships, ...entityNeighborhood.relationships, ...cardNeighborhood.relationships]
              .find(({ id }) => id === message.element_id);
            if (!node && !relationship) throw { code: "not_found", message: "Graph element was not found" };
            const directConnections = node?.type === "AREA" ? areaExploration
              : node?.type === "DASHBOARD" ? dashboardNeighborhood : exploration;
            return { node: node || null, relationship: relationship || null, directConnections };
          }
          if (type === "ontology/graph_expand" && state === "dashboard-focus") return dashboardNeighborhood;
          if (type === "ontology/graph_expand" && state === "double-click-expansion") {
            if (message.node_id === "Area:kitchen") return areaNeighborhood;
            if (message.node_id === "Device:lamp") {
              return { ...exploration, nodes: exploration.nodes.filter((node) => node.type === "ENTITY") };
            }
            if (message.node_id === "Entity:sensor.kitchen_temperature") return entityNeighborhood;
            if (message.node_id === "Device:hall-display") {
              return {
                nodes: [entityNeighborhood.nodes[1], exploration.nodes[1]],
                relationships: [entityNeighborhood.relationships[0]],
                truncated: false,
                next_cursor: null,
                revision: 8,
              };
            }
            if (message.node_id === "DashboardCard:lovelace::0::0") return cardNeighborhood;
            throw { code: "not_found", message: "Graph element was not found" };
          }
          if (type === "ontology/graph_expand" && state === "interactive") return exploration;
          if (type !== "ontology/graph_snapshot") throw new Error(`Unexpected command: ${type}`);
          if (state === "loading") {
            return new Promise(() => {});
          }
          if (state === "unavailable") {
            throw { code: "gateway_unavailable", message: "Ontology graph is unavailable" };
          }
          if (state === "error") {
            throw new Error("Fixture failure");
          }
          if (state === "empty") {
            return { ...populated, nodes: [], relationships: [] };
          }
          if (state === "partial") {
            return { ...populated, truncated: true, next_cursor: "page-2" };
          }
          if (state === "live-updates") {
            return { ...populated, revision: 7 };
          }
          if (state === "area-overview" || state === "double-click-expansion") {
            return areaOverview;
          }
          if (state === "dashboard-focus") {
            return { ...dashboardNeighborhood, nodes: [cardNeighborhood.nodes[2]], relationships: [] };
          }
          if (state === "malformed") {
            return {
              ...populated,
              nodes: [...populated.nodes, populated.nodes[0]],
              relationships: [
                ...populated.relationships,
                populated.relationships[0],
                { id: "ORPHAN:1", type: "ORPHAN", source: "Area:kitchen", target: "Device:missing", directed: true, properties: [] },
              ],
            };
          }
          return populated;
        },
      };
      // For live-updates tests: expose a helper to inject events and subscription state
      if (state === "live-updates") {
        panel._dispatchLiveEvent = (event) => {
          if (typeof panel._handleLiveEvent === "function") panel._handleLiveEvent(event);
        };
      }
    </script>
  </body>
</html>
