language: "en"
intents:
  OntologyLowBatteryAreas:
    data:
      - sentences:
          - "which rooms have devices with low batteries"
          - "where are the low batteries"
  OntologyActiveConsumers:
    data:
      - sentences:
          - "what appliances currently consume electricity"
          - "which devices are using power"
  OntologyAutomationDependencies:
    data:
      - sentences:
          - "what automations depend on {ontology_entity}"
          - "what uses {ontology_entity}"
          - "what depends on {ontology_entity}"
  OntologyAreaContents:
    data:
      - sentences:
          - "what devices are in {ontology_area}"
          - "what's in the {ontology_area}"
          - "what is in the {ontology_area}"
  OntologyEntityContext:
    data:
      - sentences:
          - "what is {ontology_entity} connected to"
          - "tell me about {ontology_entity}"
  OntologyDeviceContext:
    data:
      - sentences:
          - "what is the device {ontology_device} connected to"
          - "tell me about the device {ontology_device}"
  OntologyImpactAnalysis:
    data:
      - sentences:
          - "what would be affected if {ontology_entity} was removed"
          - "what depends on {ontology_entity} if it stopped working"
  OntologySearch:
    data:
      - sentences:
          - "search the ontology for {ontology_term}"
          - "find {ontology_term} in the ontology"

lists:
  ontology_entity:
    wildcard: true
  ontology_area:
    wildcard: true
  ontology_device:
    wildcard: true
  ontology_term:
    wildcard: true
