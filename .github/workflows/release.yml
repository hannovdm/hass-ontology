name: Release

# Automatically tag and publish a GitHub Release whenever the version changes
# on main or a supported release branch.
# HACS reads GitHub Releases (not just git tags) to detect updates, so this
# is what makes "Update available" show up with the correct version in HA.
on:
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "custom_components/ontology/manifest.json"
      - "pyproject.toml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and classify version
        id: version
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          manifest = json.loads(Path("custom_components/ontology/manifest.json").read_text())
          project = tomllib.loads(Path("pyproject.toml").read_text())
          manifest_version = manifest.get("version")
          project_version = project.get("project", {}).get("version")

          if not manifest_version:
            raise SystemExit("manifest.json does not contain a version")
          if manifest_version != project_version:
            raise SystemExit(
              f"Version mismatch: manifest.json={manifest_version!r}, "
              f"pyproject.toml={project_version!r}"
            )

          branch = os.environ["GITHUB_REF_NAME"]
          if branch.startswith("release/"):
            release_line = branch.removeprefix("release/")
            match = re.fullmatch(r"(\d+)\.(\d+)(?:\.\d+)?(?:.*)", manifest_version)
            if match is None or f"{match.group(1)}.{match.group(2)}" != release_line:
              raise SystemExit(
                f"Branch {branch!r} can only publish {release_line}.x versions, "
                f"not {manifest_version!r}"
              )

          prerelease = bool(
            re.search(r"(?:^|[.\-_]?)(?:a|alpha|b|beta|rc|dev)\d*$", manifest_version, re.I)
          )
          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as stream:
            stream.write(f"version={manifest_version}\n")
            stream.write(f"tag=v{manifest_version}\n")
            stream.write(f"prerelease={str(prerelease).lower()}\n")
          PY

      - name: Check if tag already exists
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
